name: Build CustomSwatches Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout SML
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: satisfactorymodding/SatisfactoryModLoader
          path: SML
      
      - name: Checkout Mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: SML/Mods/CustomSwatches

      # Move SML to a short path (D:\SML — workspace drive, split disk from C:\ue) —
      # the default workspace path (D:\a\<org>\<repo>\SML\...) exceeds Windows MAX_PATH
      # (260) during Package Mod's link actions. Keeping it on D: balances disk across
      # two drives (engine stays on C:), mirroring official SML CI's /tmp/work trick.
      # robocopy (not Move-Item) — .git files are read-only, which breaks Move.
      - name: Move SML to short path
        shell: powershell
        run: |
          robocopy "$env:GITHUB_WORKSPACE\SML" "D:\SML" /E /MOVE /NFL /NDL /NJH /NJS /NP
          # robocopy returns 1 for "files copied successfully" (>=8 is a real error)
          if ($LASTEXITCODE -ge 8) { exit 1 }
          exit 0
      
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # UE CSS-Editor engine extracts ~14GB; standard windows-latest only has ~14GB
      # free, so drop bulky preinstalled tooling first. (No third-party action — native PS.)
      # NB: keep C:\ProgramData\chocolatey (provides 7z) AND dotnet (UnrealBuildTool needs
      # the .NET 8 runtime to run).
      - name: Free build disk space
        shell: powershell
        run: |
          $targets = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\Haskell',
            'C:\Program Files\CodeQL',
            'C:\hostedtoolcache\windows',
            'C:\Users\runneradmin\.nuget'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) { Remove-Item $t -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C | Select-Object Used,Free | Format-List
      
      - name: Download CSS Engine
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          mkdir C:\ue
          cd C:\ue
          gh release download --repo satisfactorymodding/UnrealEngine -p "UnrealEngine-CSS-Editor-Win64.7z.*"
          7z x "UnrealEngine-CSS-Editor-Win64.7z.001" -o"C:\ue" -aoa
          Remove-Item "UnrealEngine-CSS-Editor-Win64.7z.*"
          # Register engine root under the uproject's exact EngineAssociation
          # (5.6.1-CSS). UnrealVersionSelector -register keys by the engine's real
          # version, not the custom association, so wwise-cli's integrate-ue can't
          # find it. Write the HKCU value directly (what listengines_windows.go reads).
          reg.exe add "HKCU\SOFTWARE\Epic Games\Unreal Engine\Builds" /v "5.6.1-CSS" /d "C:\ue" /f
        shell: powershell
      
      - name: Download Wwise
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          gh release download --repo mircearoata/wwise-cli -p "wwise-cli_windows_amd64.exe" -O wwise-cli.exe
          .\wwise-cli.exe download --sdk-version "2023.1.14.8770" --filter Packages=SDK --filter DeploymentPlatforms=Windows_vc160 --filter DeploymentPlatforms=Windows_vc170 --filter DeploymentPlatforms=
          .\wwise-cli.exe integrate-ue --integration-version "2023.1.14.3555" --project "D:\SML\FactoryGame.uproject"
        shell: powershell
      
      - name: Generate project files
        run: |
          cd D:\SML
          C:\ue\Engine\Binaries\DotNET\UnrealBuildTool\UnrealBuildTool.exe -projectfiles -project="D:\SML\FactoryGame.uproject" -game -engine
        shell: powershell
      
      - name: Build FactoryEditor
        run: |
          cd D:\SML
          C:\ue\Engine\Build\BatchFiles\Build.bat FactoryEditor Win64 Development -project="D:\SML\FactoryGame.uproject" -NoHotReload
        shell: powershell
      
      - name: Package Mod
        run: |
          C:\ue\Engine\Build\BatchFiles\RunUAT.bat -ScriptsForProject="D:\SML\FactoryGame.uproject" PackagePlugin -Project="D:\SML\FactoryGame.uproject" -dlcname=CustomSwatches -build -server -clientconfig=Shipping -serverconfig=Shipping -platform=Win64 -serverplatform=Win64 -nocompileeditor -installed
        shell: powershell
      
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CustomSwatches-${{ github.run_number }}
          path: D:\SML\Saved\ArchivedPlugins\CustomSwatches\*.zip
